name: CutsceneCity Twitch VOD Shorts (review only)
on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: Twitch VOD URL
        required: true
        default: https://www.twitch.tv/videos/2936544559
      render:
        description: Render review candidates
        required: true
        type: boolean
        default: true
jobs:
  generate-review-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      VOD_URL: ${{ inputs.vod_url }}
      RENDER: ${{ inputs.render }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r tools/twitch-shorts/requirements.txt
      - name: Generate candidates without publishing
        shell: bash
        run: |
          args=()
          if [ "$RENDER" = "true" ]; then args+=(--render); fi
          python tools/twitch-shorts/pipeline.py --url "$VOD_URL" --output output --limit 6 "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twitch-shorts-review
          path: |
            output/manifest.json
            output/short_*.mp4
          retention-days: 3
