name: CutsceneCity Twitch VOD Shorts (review only)
on:
  workflow_dispatch:
    inputs:
      vod_url:
        description: URL of YOUR OWN Twitch VOD (https://www.twitch.tv/videos/<id>); no default
        required: true
      enable_external_ai:
        description: Explicitly authorize external Gemini processing and possible API charges
        required: true
        type: boolean
        default: false
      render:
        description: Render review candidates
        required: true
        type: boolean
        default: true
jobs:
  generate-review-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      VOD_URL: ${{ inputs.vod_url }}
      RENDER: ${{ inputs.render }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r tools/twitch-shorts/requirements.txt
      - name: Run fail-closed QA unit tests
        run: python -m unittest discover -s tools/twitch-shorts -p "test_*.py"
      - name: Generate candidates without publishing
        shell: bash
        run: |
          args=()
          if [ "$RENDER" = "true" ]; then args+=(--render); fi
          python tools/twitch-shorts/pipeline.py --url "$VOD_URL" --output output --limit 6 "${args[@]}"
      - name: Optional AI frame assessment (never authorizes publishing)
        if: ${{ inputs.enable_external_ai }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/twitch-shorts/visual_review.py --output output
      - name: Technical quality validation
        if: ${{ inputs.render }}
        run: python tools/twitch-shorts/qa.py --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twitch-shorts-review
          path: |
            output/manifest.json
          retention-days: 3
